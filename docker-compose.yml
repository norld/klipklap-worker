services:
  yt-dlp-worker:
    build: .
    container_name: yt-dlp-worker
    volumes:
      - yt-dlp-downloads:/app/downloads
      - ./logs:/app/logs
      # Mount Chromium config for --cookies-from-browser support
      # Uncomment the line below and adjust path to your host's Chromium config
      - ~/.config/chromium:/root/.config/chromium:ro
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT}
      - API_KEY=${API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  yt-dlp-downloads:
    driver: local